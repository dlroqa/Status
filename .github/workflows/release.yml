name: Release

# macOS installers can only be produced on macOS and Windows installers on Windows, so the
# three platforms are built on their own runners and their artifacts collected into one
# GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: pnpm exec electron-builder --linux --publish never
          - os: windows-latest
            command: pnpm exec electron-builder --win --publish never
          - os: macos-latest
            command: pnpm exec electron-builder --mac --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron-vite build
      - run: ${{ matrix.command }}

      # v0.1.0 shipped a macOS build that could not launch and the pipeline never noticed,
      # because a green electron-builder run says nothing about whether the bundle is
      # actually loadable. This verifies the signature, the entitlements the hardened
      # runtime needs, and that the app survives launch on a real Mac.
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: ./scripts/verify-macos-app.sh release

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          draft: false
          body: |
            One **universal** macOS download containing both arm64 and x86_64: it runs
            natively on Apple Silicon (M1/M2/M3/M4) and Intel. Requires macOS 11+.

            Builds are ad-hoc signed but **not notarised** (that needs a paid Apple
            certificate), so Gatekeeper blocks the first launch. macOS 15 Sequoia removed
            the old Control-click shortcut, so:

            1. Open the app once and let it be refused.
            2. **System Settings → Privacy & Security → Security**.
            3. Click **Open Anyway**, then confirm.

            On macOS 14 and earlier, right-click the app and choose **Open**.

            Or clear it in one command, which works on every version:

            ```
            xattr -dr com.apple.quarantine "/Applications/AI Usage Monitor.app"
            ```

            **Windows:** SmartScreen will warn — choose **More info → Run anyway**.
