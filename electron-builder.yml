appId: io.github.dlroqa.ai-usage-monitor
productName: AI Usage Monitor
copyright: Copyright © 2026 Ed (@dlroqa)

directories:
  output: release
  buildResources: build

# Only the built output ships. Source, tests and dev config stay out of the package.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# The app reads local config only; nothing needs to be unpacked or executed.
asar: true

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Utility
  synopsis: Track usage across your AI subscription accounts
  description: >-
    Shows the 5-hour, weekly and monthly usage of each of your AI subscription accounts
    side by side, reading the sessions your CLIs already hold. Subscription authentication
    only — no API keys.
  icon: build/icon.png
  maintainer: erocaide@gmail.com
  syncDesktopName: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  # v0.1.0 ships unsigned; signing and notarisation need certificates that are not part
  # of this repository. Hardened runtime is on so that signing later needs no changes.
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    LSUIElement: false

dmg:
  title: ${productName} ${version}
