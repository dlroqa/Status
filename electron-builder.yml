appId: io.github.dlroqa.ai-usage-monitor
productName: AI Usage Monitor
copyright: Copyright © 2026 Ed (@dlroqa)

directories:
  output: release
  buildResources: build

# Only the built output ships. Source, tests and dev config stay out of the package.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# The app reads local config only; nothing needs to be unpacked or executed.
asar: true

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Utility
  synopsis: Track usage across your AI subscription accounts
  description: >-
    Shows the 5-hour, weekly and monthly usage of each of your AI subscription accounts
    side by side, reading the sessions your CLIs already hold. Subscription authentication
    only — no API keys.
  icon: build/icon.png
  maintainer: erocaide@gmail.com
  syncDesktopName: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  # A single universal binary carrying both arm64 and x86_64 slices. It runs natively on
  # every Apple Silicon Mac (M1 through M4) and on Intel, which removes the failure mode
  # where someone downloads the Intel build onto an Apple Silicon Mac and gets a crossed-out
  # icon because Rosetta 2 is not installed. It costs download size and is worth it: there
  # is no architecture for the user to choose wrongly.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Ad-hoc signing. Without this, electron-builder finds no Developer ID certificate and
  # skips signing entirely — and macOS refuses to launch unsigned arm64 code at all, which
  # is why an unsigned build shows a crossed-out icon in Finder rather than a Gatekeeper
  # prompt. An ad-hoc signature carries no identity and does not satisfy notarisation, but
  # it does make the app runnable. Real signing later only needs a certificate plus
  # CSC_LINK/CSC_KEY_PASSWORD; nothing else here changes.
  #
  # Ad-hoc signing combined with hardenedRuntime requires the
  # com.apple.security.cs.disable-library-validation entitlement, which
  # build/entitlements.mac.plist provides. Removing one without the other breaks launch.
  identity: '-'
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    LSUIElement: false

dmg:
  title: ${productName} ${version}
